body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}

.prompt{font-family:var(--mono);font-size:14px;font-weight:500;min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:baseline;row-gap:2px}
.prompt .user{color:var(--mute)}

.prompt .path{font-weight:700}
.prompt .dollar{color:var(--accent);font-weight:700;margin:0 8px 0 4px}
.prompt .typed{color:var(--ink)}
.cursor{display:inline-block;width:9px;height:1.05em;background:var(--accent);margin-left:2px;transform:translateY(3px);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nav{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:13px}
.nav a{padding:7px 12px;border:1.5px solid var(--line);border-radius:6px;text-decoration:none;background:var(--bg)}
.nav a:hover,.langbtn:hover{border-color:var(--accent)}
.langbtn{padding:7px 12px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.nav a::first-letter,.row .slug::first-letter{text-transform:uppercase}
.nav a[aria-current="page"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}

main{flex:1;padding-block:56px 72px}
.enter{animation:enter .26s ease-out}

.lead{font-size:clamp(17px,2.4vw,22px);line-height:1.55;color:var(--soft);max-width:760px}
.lab{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

.term-body .p{color:var(--term-prompt)}
.term-body .o{color:var(--term-mute)}
.term-body a{color:var(--term-fg);text-decoration:underline;text-decoration-color:var(--term-prompt);text-underline-offset:4px;margin-right:14px;display:inline-block}

.term-body .caret{display:inline-block;width:9px;height:1.05em;background:var(--term-fg);transform:translateY(3px);animation:blink 1.05s steps(1) infinite}

.head{display:flex;flex-direction:column;gap:14px;margin-bottom:40px}
.list{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;padding:28px 30px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);text-decoration:none;transition:transform .15s,box-shadow .15s}

@media (prefers-reduced-motion:reduce){
.enter{animation:none}
.cursor,.term-body .caret{animation:none}
.row{transition:none}
}

  if (h.indexOf('projet-') === 0) {

  }

  return { key: 'accueil', nav: 'accueil', segs: BASE.slice() };
}

function cmdFor(from, to) {
  let c = 0;
  while (c < from.length && c < to.length && from[c] === to[c]) c++;
  if (c === from.length && c === to.length) return '';
  if (c < 2) return 'cd ' + to.join('/');
  const ups = from.length - c;
  const rest = to.slice(c);
  if (ups === 0) return 'cd ' + rest.join('/');
  const parts = [];
  for (let k = 0; k < ups; k++) parts.push('..');
  return 'cd ' + parts.concat(rest).join('/');
}

  drawPrompt(curSegs, '');
  let html;
  if (r.key === 'projets') html = viewProjets();
  else if (r.key === 'projet') html = viewProjet(r.i);
  else if (r.key === 'apropos') html = viewApropos();
  else if (r.key === 'competences') html = viewCompetences();
  else if (r.key === 'contact') html = viewContact();
  else html = viewAccueil();
  viewEl.classList.remove('enter');
  viewEl.innerHTML = html;
  void viewEl.offsetWidth;
  viewEl.classList.add('enter');
  navEl.querySelectorAll('a').forEach(a => {
    if (a.getAttribute('data-k') === r.nav) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
}

function go(animate) {
  const r = parse();
  const my = ++tok;
  const cmd = cmdFor(curSegs, r.segs);
  if (!animate || reduce || !cmd) { show(r); return; }
  let n = 0;
  const step = function () {
    if (my !== tok) return;
    n++;
    drawPrompt(curSegs, cmd.slice(0, n));
    if (n < cmd.length) setTimeout(step, 22);
    else setTimeout(function () { if (my === tok) show(r); }, 170);
  };
  step();
}

function closeLb() {
  const lb = document.getElementById('lb');
  if (lb) lb.remove();
}

viewEl.addEventListener('click', function (e) {
  const z = e.target.closest('[data-zoom]');
  if (z) {
    closeLb();
    const lb = document.createElement('div');
    lb.className = 'lb';
    lb.id = 'lb';
    lb.innerHTML = '<span>' + t('close') + '</span><img src="' + z.getAttribute('data-zoom') + '" alt="' + z.getAttribute('data-alt') + '">';
    lb.addEventListener('click', closeLb);
    document.body.appendChild(lb);
    return;
  }
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const txt = b.getAttribute('data-copy');
  const done = function () { b.textContent = t('copied'); setTimeout(function () { b.textContent = t('copy'); }, 1400); };
  const fallback = function () {
    const code = viewEl.querySelector('.mail code');
    if (code) {
      const range = document.createRange();
      range.selectNodeContents(code);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    b.textContent = t('selected');
  };
  try {
    navigator.clipboard.writeText(txt).then(done, fallback);
  } catch (err) {
    fallback();
  }
});

document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
window.addEventListener('hashchange', function () { closeLb(); go(true); });
document.getElementById('lang').addEventListener('click', function () { setLang(LANG === 'fr' ? 'en' : 'fr'); });
applyChrome();
go(false);
</script>
